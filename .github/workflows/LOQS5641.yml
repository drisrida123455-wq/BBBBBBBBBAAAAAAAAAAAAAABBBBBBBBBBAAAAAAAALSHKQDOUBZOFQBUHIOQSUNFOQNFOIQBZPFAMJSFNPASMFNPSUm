name: Windows RDP via AiTun

on:
  push:

jobs:
  rdp-setup:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      - name: Download AiTun
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://aitun.cc/downloads/aitun-client-windows-amd64.exe"
          $aitun = "$env:GITHUB_WORKSPACE\aitun.exe"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $aitun

          if (-not (Test-Path $aitun)) {
            throw "AiTun download failed."
          }

          Write-Host "AiTun downloaded successfully."

      - name: Enable RDP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Set-Service `
            -Name "TermService" `
            -StartupType Automatic

          Start-Service `
            -Name "TermService" `
            -ErrorAction SilentlyContinue

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop"

          Write-Host "RDP enabled successfully."

      - name: Create RDP User
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $username = "H1Z"
          $password = "DRISdris@123"

          $existing = Get-LocalUser `
            -Name $username `
            -ErrorAction SilentlyContinue

          if ($existing) {
            Remove-LocalUser `
              -Name $username
          }

          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          New-LocalUser `
            -Name $username `
            -Password $securePassword `
            -FullName "H1Z RDP User" `
            -Description "Temporary RDP user" `
            -PasswordNeverExpires

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $username

          Write-Host "RDP user created."

      - name: Allow RDP Firewall
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Get-NetFirewallRule `
              -DisplayName "Allow RDP via AiTun" `
              -ErrorAction SilentlyContinue)) {

            New-NetFirewallRule `
              -DisplayName "Allow RDP via AiTun" `
              -Direction Inbound `
              -Action Allow `
              -Protocol TCP `
              -LocalPort 3389
          }

          Write-Host "Firewall configured."

      - name: Start AiTun RDP Tunnel
        shell: pwsh
        env:
          AITUN_TOKEN: ${{ secrets.AITUN_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:AITUN_TOKEN)) {
            throw "AITUN_TOKEN GitHub Secret is missing."
          }

          $aitun = "$env:GITHUB_WORKSPACE\aitun.exe"

          Write-Host "Starting AiTun RDP tunnel..."

          Start-Process `
            -FilePath $aitun `
            -ArgumentList "-k `"$env:AITUN_TOKEN`" rdp" `
            -RedirectStandardOutput "$env:RUNNER_TEMP\aitun.log" `
            -RedirectStandardError "$env:RUNNER_TEMP\aitun-error.log" `
            -WindowStyle Hidden

          $deadline = (Get-Date).AddSeconds(90)
          $found = $false

          while ((Get-Date) -lt $deadline) {

            Start-Sleep -Seconds 3

            if (Test-Path "$env:RUNNER_TEMP\aitun.log") {

              $output = Get-Content `
                "$env:RUNNER_TEMP\aitun.log" `
                -Raw `
                -ErrorAction SilentlyContinue

              if ($output) {
                Write-Host $output

                if ($output -match '([A-Za-z0-9.-]+\.aitun\.cc)') {
                  $found = $true
                  break
                }
              }
            }
          }

          if (-not $found) {

            Write-Host ""
            Write-Host "========== AiTun OUTPUT =========="

            if (Test-Path "$env:RUNNER_TEMP\aitun.log") {
              Get-Content "$env:RUNNER_TEMP\aitun.log"
            }

            Write-Host ""
            Write-Host "========== AiTun ERROR =========="

            if (Test-Path "$env:RUNNER_TEMP\aitun-error.log") {
              Get-Content "$env:RUNNER_TEMP\aitun-error.log"
            }

            throw "AiTun RDP tunnel could not be established."
          }

          Write-Host ""
          Write-Host "============================================"
          Write-Host "       WINDOWS RDP VIA AITUN"
          Write-Host "============================================"
          Write-Host "Username: H1Z"
          Write-Host "Password: DRISdris@123"
          Write-Host "============================================"
          Write-Host ""

          while ($true) {
            Start-Sleep -Seconds 300
          }

      - name: Cleanup
        if: always()
        shell: pwsh
        run: |
          Get-Process `
            -Name "aitun" `
            -ErrorAction SilentlyContinue |
            Stop-Process `
              -Force `
              -ErrorAction SilentlyContinue
