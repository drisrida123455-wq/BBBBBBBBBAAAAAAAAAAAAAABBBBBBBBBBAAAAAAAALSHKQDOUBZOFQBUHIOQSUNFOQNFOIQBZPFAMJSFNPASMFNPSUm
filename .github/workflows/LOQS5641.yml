name: Windows RDP via SuperDMZ

on:
  push:
  workflow_dispatch:

jobs:
  rdp-setup:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      - name: Download SuperDMZ Client
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # رابط تحميل أداة SuperDMZ للويندوز
          $url = "https://github.com/superdmz/superdmz/releases/latest/download/superdmz-windows-amd64.exe"
          $dmz = "$env:GITHUB_WORKSPACE\superdmz.exe"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $dmz

          if (-not (Test-Path $dmz)) {
            throw "SuperDMZ download failed."
          }

          Write-Host "SuperDMZ downloaded successfully."

      - name: Enable RDP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Set-Service `
            -Name "TermService" `
            -StartupType Automatic

          Start-Service `
            -Name "TermService" `
            -ErrorAction SilentlyContinue

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop"

          Write-Host "RDP enabled successfully."

      - name: Create RDP User
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $username = "H1Z"
          $password = "DRISdris@123"

          $existing = Get-LocalUser `
            -Name $username `
            -ErrorAction SilentlyContinue

          if ($existing) {
            Remove-LocalUser `
              -Name $username
          }

          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          New-LocalUser `
            -Name $username `
            -Password $securePassword `
            -FullName "H1Z RDP User" `
            -Description "Temporary RDP user" `
            -PasswordNeverExpires

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $username

          Write-Host "RDP user created."

      - name: Allow RDP Firewall
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Get-NetFirewallRule `
              -DisplayName "Allow RDP via SuperDMZ" `
              -ErrorAction SilentlyContinue)) {

            New-NetFirewallRule `
              -DisplayName "Allow RDP via SuperDMZ" `
              -Direction Inbound `
              -Action Allow `
              -Protocol TCP `
              -LocalPort 3389
          }

          Write-Host "Firewall configured."

      - name: Start SuperDMZ RDP Tunnel
        shell: pwsh
        env:
          SUPERDMZ_TOKEN: ${{ secrets.SUPERDMZ_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:SUPERDMZ_TOKEN)) {
            throw "SUPERDMZ_TOKEN GitHub Secret is missing."
          }

          $dmz = "$env:GITHUB_WORKSPACE\superdmz.exe"

          Write-Host "Starting SuperDMZ RDP tunnel..."

          # تشغيل النفق المربوط بالـ TOKEN الخاص بك
          Start-Process `
            -FilePath $dmz `
            -ArgumentList "-t `"$env:SUPERDMZ_TOKEN`"" `
            -RedirectStandardOutput "$env:RUNNER_TEMP\superdmz.log" `
            -RedirectStandardError "$env:RUNNER_TEMP\superdmz-error.log" `
            -WindowStyle Hidden

          $deadline = (Get-Date).AddSeconds(90)
          $found = $false

          while ((Get-Date) -lt $deadline) {

            Start-Sleep -Seconds 3

            if (Test-Path "$env:RUNNER_TEMP\superdmz.log") {

              $output = Get-Content `
                "$env:RUNNER_TEMP\superdmz.log" `
                -Raw `
                -ErrorAction SilentlyContinue

              if ($output) {
                Write-Host $output

                if ($output -match '(dmzgate\.com|connected|online)') {
                  $found = $true
                  break
                }
              }
            }
          }

          Write-Host ""
          Write-Host "============================================"
          Write-Host "       WINDOWS RDP VIA SUPERDMZ"
          Write-Host "============================================"
          Write-Host "Username: H1Z"
          Write-Host "Password: DRISdris@123"
          Write-Host "Address: rdp-free-on-github.dmzgate.com:17931"
          Write-Host "============================================"
          Write-Host ""

          # إبقاء الجلسة مفتوحة طوال وقت الـ Workflow
          while ($true) {
            Start-Sleep -Seconds 300
          }

      - name: Cleanup
        if: always()
        shell: pwsh
        run: |
          Get-Process `
            -Name "superdmz" `
            -ErrorAction SilentlyContinue |
            Stop-Process `
              -Force `
              -ErrorAction SilentlyContinue
