name: Windows RDP via Ngrok

on:
  push:

jobs:
  rdp-setup:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      - name: Download Ngrok
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-stable-windows-amd64.zip"
          $zip = "$env:TEMP\ngrok.zip"
          $dir = "$env:RUNNER_TEMP\ngrok"

          Invoke-WebRequest -Uri $url -OutFile $zip

          if (Test-Path $dir) {
            Remove-Item $dir -Recurse -Force
          }

          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          Expand-Archive -Path $zip -DestinationPath $dir -Force

          Remove-Item $zip -Force

          if (-not (Test-Path "$dir\ngrok.exe")) {
            throw "ngrok.exe was not found after extraction."
          }

          Copy-Item "$dir\ngrok.exe" "$env:GITHUB_WORKSPACE\ngrok.exe" -Force

          Write-Host "Ngrok downloaded successfully."

      - name: Authenticate Ngrok
        shell: pwsh
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:NGROK_AUTH_TOKEN)) {
            throw "NGROK_AUTH_TOKEN secret is missing."
          }

          & "$env:GITHUB_WORKSPACE\ngrok.exe" config add-authtoken "$env:NGROK_AUTH_TOKEN"

          if ($LASTEXITCODE -ne 0) {
            throw "Ngrok authentication failed."
          }

      - name: Enable RDP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Write-Host "RDP enabled successfully."

      - name: Create RDP User
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $username = "H1Z"
          $password = "DRISdris@123"

          $existing = net user $username 2>&1

          if ($LASTEXITCODE -eq 0) {
            net user $username /delete

            if ($LASTEXITCODE -ne 0) {
              throw "Could not remove existing H1Z account."
            }
          }

          net user $username $password /add

          if ($LASTEXITCODE -ne 0) {
            throw "Could not create H1Z account."
          }

          net localgroup Administrators $username /add

          if ($LASTEXITCODE -ne 0) {
            throw "Could not add H1Z to Administrators."
          }

          Write-Host "RDP user H1Z created successfully."

      - name: Allow RDP Firewall Rule
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $rule = Get-NetFirewallRule `
            -DisplayName "Allow RDP via Ngrok" `
            -ErrorAction SilentlyContinue

          if (-not $rule) {
            New-NetFirewallRule `
              -DisplayName "Allow RDP via Ngrok" `
              -Direction Inbound `
              -Action Allow `
              -Protocol TCP `
              -LocalPort 3389 | Out-Null
          }

          Write-Host "Firewall rule configured."

      - name: Start Ngrok RDP Tunnel
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $ngrok = "$env:GITHUB_WORKSPACE\ngrok.exe"
          $log = "$env:RUNNER_TEMP\ngrok.log"

          if (Test-Path $log) {
            Remove-Item $log -Force
          }

          Start-Process `
            -FilePath $ngrok `
            -ArgumentList "tcp 3389 --log=stdout" `
            -RedirectStandardOutput $log `
            -RedirectStandardError $log `
            -WindowStyle Hidden

          $publicUrl = $null
          $deadline = (Get-Date).AddSeconds(90)

          while ((Get-Date) -lt $deadline -and -not $publicUrl) {
            Start-Sleep -Seconds 3

            try {
              $tunnels = Invoke-RestMethod `
                -Uri "http://127.0.0.1:4040/api/tunnels" `
                -Method Get `
                -ErrorAction Stop

              if ($tunnels.tunnels.Count -gt 0) {
                $publicUrl = $tunnels.tunnels[0].public_url
              }
            }
            catch {
              # Ngrok API may not be ready yet.
            }

            if (-not $publicUrl -and (Test-Path $log)) {
              $content = Get-Content $log -Raw -ErrorAction SilentlyContinue

              if ($content -match 'tcp://([A-Za-z0-9\.\-]+:\d+)') {
                $publicUrl = "tcp://$($Matches[1])"
              }
            }
          }

          if (-not $publicUrl) {
            Write-Host "Ngrok log:"
            if (Test-Path $log) {
              Get-Content $log
            }

            throw "Ngrok tunnel could not be established."
          }

          $address = $publicUrl -replace "^tcp://", ""

          Write-Host ""
          Write-Host "============================================"
          Write-Host "          WINDOWS RDP CONNECTION"
          Write-Host "============================================"
          Write-Host "Address : $address"
          Write-Host "User    : H1Z"
          Write-Host "Password: DRISdris@123"
          Write-Host "============================================"
          Write-Host ""
          Write-Host "Use mstsc.exe and enter the Address above."
          Write-Host ""

          while ($true) {
            Start-Sleep -Seconds 300
          }

      - name: Cleanup
        if: always()
        shell: pwsh
        run: |
          Get-Process ngrok -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue
