name: Windows RDP via SuperDMZ

on:
  push:
  workflow_dispatch:

jobs:
  rdp-setup:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      - name: Download and Install SuperDMZ
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $downloadUrl = "https://raw.githubusercontent.com/drisrida123455-wq/Xddg77-GbklKMooooooooo156sqd89fh47gfhj-g/main/SuperDMZ-Setup-v1.9.1.exe"
          $installer = "$env:RUNNER_TEMP\installer.exe"
          $installDir = "$env:RUNNER_TEMP\SuperDMZ"
          $targetExec = "$env:GITHUB_WORKSPACE\superdmz.exe"

          Write-Host "جاري تحميل برنامج التثبيت..."
          curl.exe -sL $downloadUrl -o $installer

          if (-not (Test-Path $installer) -or (Get-Item $installer).Length -lt 500000) {
            throw "فشل تحميل ملف التثبيت، يرجى التأكد من وجود الملف في المستودع."
          }

          Write-Host "جاري تشغيل التثبيت الصامت للبرنامج..."
          Start-Process -FilePath $installer -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=`"$installDir`"" -Wait

          Start-Sleep -Seconds 3

          # البحث عن الملف التنفيذي المباشر داخل مجلد التثبيت أو المسارات الافتراضية
          $searchPaths = @(
            $installDir,
            "C:\Program Files\SuperDMZ",
            "C:\Program Files (x86)\SuperDMZ",
            "$env:LOCALAPPDATA\Programs\SuperDMZ"
          )

          $foundExe = Get-ChildItem -Path $searchPaths -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue | 
            Where-Object { $_.Name -notmatch "unins|setup" } | 
            Select-Object -First 1

          if ($foundExe) {
            Copy-Item -Path $foundExe.FullName -Destination $targetExec -Force
            Write-Host "تم تثبيت واستخراج الملف التنفيذي بنجاح: $($foundExe.Name)"
          } else {
            throw "تعذر تحديد موقع الملف التنفيذي بعد التثبيت."
          }

      - name: Enable RDP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Set-Service `
            -Name "TermService" `
            -StartupType Automatic

          Start-Service `
            -Name "TermService" `
            -ErrorAction SilentlyContinue

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop"

          Write-Host "RDP enabled successfully."

      - name: Create RDP User
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $username = "H1Z"
          $password = "DRISdris@123"

          $existing = Get-LocalUser `
            -Name $username `
            -ErrorAction SilentlyContinue

          if ($existing) {
            Remove-LocalUser `
              -Name $username
          }

          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          New-LocalUser `
            -Name $username `
            -Password $securePassword `
            -FullName "H1Z RDP User" `
            -Description "Temporary RDP user" `
            -PasswordNeverExpires

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $username

          Write-Host "RDP user created."

      - name: Allow RDP Firewall
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Get-NetFirewallRule `
              -DisplayName "Allow RDP via SuperDMZ" `
              -ErrorAction SilentlyContinue)) {

            New-NetFirewallRule `
              -DisplayName "Allow RDP via SuperDMZ" `
              -Direction Inbound `
              -Action Allow `
              -Protocol TCP `
              -LocalPort 3389
          }

          Write-Host "Firewall configured."

      - name: Start SuperDMZ RDP Tunnel
        shell: pwsh
        env:
          SUPERDMZ_TOKEN: ${{ secrets.SUPERDMZ_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:SUPERDMZ_TOKEN)) {
            throw "SUPERDMZ_TOKEN GitHub Secret is missing."
          }

          $dmz = "$env:GITHUB_WORKSPACE\superdmz.exe"

          if (-not (Test-Path $dmz)) {
            throw "الملف التنفيذي superdmz.exe غير موجود لربط النفق!"
          }

          Write-Host "Starting SuperDMZ RDP tunnel..."

          Start-Process `
            -FilePath $dmz `
            -ArgumentList "-k `"$env:SUPERDMZ_TOKEN`" rdp" `
            -RedirectStandardOutput "$env:RUNNER_TEMP\superdmz.log" `
            -RedirectStandardError "$env:RUNNER_TEMP\superdmz-error.log" `
            -WindowStyle Hidden

          Start-Sleep -Seconds 12

          if (Test-Path "$env:RUNNER_TEMP\superdmz.log") {
            Get-Content "$env:RUNNER_TEMP\superdmz.log" -ErrorAction SilentlyContinue
          }
          if (Test-Path "$env:RUNNER_TEMP\superdmz-error.log") {
            Get-Content "$env:RUNNER_TEMP\superdmz-error.log" -ErrorAction SilentlyContinue
          }

          Write-Host ""
          Write-Host "============================================"
          Write-Host "       WINDOWS RDP VIA SUPERDMZ"
          Write-Host "============================================"
          Write-Host "Username: H1Z"
          Write-Host "Password: DRISdris@123"
          Write-Host "============================================"
          Write-Host ""

          while ($true) {
            Start-Sleep -Seconds 300
          }

      - name: Cleanup
        if: always()
        shell: pwsh
        run: |
          Get-Process `
            -Name "superdmz" `
            -ErrorAction SilentlyContinue |
            Stop-Process `
              -Force `
              -ErrorAction SilentlyContinue
