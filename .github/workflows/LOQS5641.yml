name: Windows RDP via SuperDMZ

on:
  push:
  workflow_dispatch:

jobs:
  rdp-setup:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      - name: Download & Extract SuperDMZ Client
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "[1/5] بدء تحميل ملف التثبيت من المستودع..." -ForegroundColor Cyan
          $downloadUrl = "https://raw.githubusercontent.com/drisrida123455-wq/Xddg77-GbklKMooooooooo156sqd89fh47gfhj-g/main/SuperDMZ-Setup-v1.9.1.exe"
          $installer = "$env:RUNNER_TEMP\installer.exe"
          $installDir = "$env:RUNNER_TEMP\SuperDMZ"
          $targetExec = "$env:GITHUB_WORKSPACE\superdmz.exe"

          curl.exe -sL $downloadUrl -o $installer
          $size = (Get-Item $installer).Length
          Write-Host "[✓] تم التحميل بنجاح. حجم الملف: $size بايت." -ForegroundColor Green

          Write-Host "[2/5] جاري تشغيل التثبيت الصامت لاستخراج العميل..." -ForegroundColor Cyan
          Start-Process -FilePath $installer -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=`"$installDir`"" -Wait

          $foundExe = Get-ChildItem -Path @($installDir, "C:\Program Files", "$env:LOCALAPPDATA") -Recurse -Filter "superdmz*.exe" -ErrorAction SilentlyContinue | 
            Where-Object { $_.Name -notmatch "unins|setup" } | 
            Select-Object -First 1

          if ($foundExe) {
            Copy-Item -Path $foundExe.FullName -Destination $targetExec -Force
            Write-Host "[✓] تم العثور على الملف التنفيذي: $($foundExe.FullName)" -ForegroundColor Green
          } else {
            throw "[-] تعذر العثور على superdmz.exe بعد التثبيت!"
          }

      - name: Enable Windows RDP Services
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "[3/5] تفعيل خدمات سطح المكتب البعيد (RDP)..." -ForegroundColor Cyan
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0
          Set-Service -Name "TermService" -StartupType Automatic
          Start-Service -Name "TermService" -ErrorAction SilentlyContinue
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Write-Host "[✓] تم تفعيل خدمة Terminal Server وجدار الحماية." -ForegroundColor Green

      - name: Dynamic RDP User Generation & Validation
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "[4/5] إنتاج والتحقق من حساب المسؤول (RDP Admin)..." -ForegroundColor Cyan

          # دالة لتوليد كلمة سر معقدة تطابق شروط Windows 100%
          function Generate-SecurePassword {
            $charsUpper = "ABCDEFGHIJKLMNOPQRSTUVWXYZ"
            $charsLower = "abcdefghijklmnopqrstuvwxyz"
            $charsDigits = "0123456789"
            $charsSpecial = "@#$%&*!"

            $pass = @(
              Get-Random -InputObject $charsUpper.ToCharArray(),
              Get-Random -InputObject $charsLower.ToCharArray(),
              Get-Random -InputObject $charsDigits.ToCharArray(),
              Get-Random -InputObject $charsSpecial.ToCharArray()
            )

            $allChars = $charsUpper + $charsLower + $charsDigits + $charsSpecial
            for ($i = 0; $i -lt 12; $i++) {
              $pass += Get-Random -InputObject $allChars.ToCharArray()
            }
            return (-join ($pass | Sort-Object { Get-Random }))
          }

          # توليد اسم مستخدم ديناميكي
          $genUsername = "User_" + (Get-Random -Minimum 1000 -Maximum 9999)
          $userCreated = $false
          $attempts = 0

          # الحلقة التكرارية لإنشاء الحساب والتحقق من الشروط
          while (-not $userCreated -and $attempts -lt 5) {
            $attempts++
            $genPassword = Generate-SecurePassword

            try {
              Write-Host "محاولة إنشاء الحساب (المحاولة $attempts)..." -ForegroundColor Gray
              $secPass = ConvertTo-SecureString $genPassword -AsPlainText -Force
              New-LocalUser -Name $genUsername -Password $secPass -FullName "Generated RDP Admin" -PasswordNeverExpires -ErrorAction Stop | Out-Null
              Add-LocalGroupMember -Group "Administrators" -Member $genUsername -ErrorAction Stop
              $userCreated = $true
            }
            catch {
              Write-Host "[!] فشلت كلمة السر في مطابقة الشروط، إعادة المحاولة بنفس لحظة..." -ForegroundColor Yellow
              Start-Sleep -Seconds 1
            }
          }

          if (-not $userCreated) {
            throw "[-] تعذر إنشاء الحساب بعد عدة محاولات بسبب شروط كلمة السر!"
          }

          # حفظ بيانات الاتصال في بيئة التشغيل لطباعتها لاحقاً
          [System.Environment]::SetEnvironmentVariable('RDP_USER', $genUsername, 'Machine')
          [System.Environment]::SetEnvironmentVariable('RDP_PASS', $genPassword, 'Machine')

          Write-Host "[✓] تم إنشاء الحساب واختبار تطابقه مع شروط الأمان بنجاح!" -ForegroundColor Green

      - name: Start SuperDMZ Live Monitoring
        shell: pwsh
        env:
          SUPERDMZ_TOKEN: ${{ secrets.SUPERDMZ_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          $finalUser = [System.Environment]::GetEnvironmentVariable('RDP_USER', 'Machine')
          $finalPass = [System.Environment]::GetEnvironmentVariable('RDP_PASS', 'Machine')

          Write-Host "[5/5] تشغيل النفق ومراقبة الاتصال live..." -ForegroundColor Cyan
          if ([string]::IsNullOrWhiteSpace($env:SUPERDMZ_TOKEN)) {
            throw "[-] خطأ: لم يتم العثور على SUPERDMZ_TOKEN في Secrets!"
          }

          $dmz = "$env:GITHUB_WORKSPACE\superdmz.exe"
          $outLog = "$env:RUNNER_TEMP\superdmz-out.log"
          $errLog = "$env:RUNNER_TEMP\superdmz-err.log"

          New-Item -ItemType File -Path $outLog -Force | Out-Null
          New-Item -ItemType File -Path $errLog -Force | Out-Null

          $process = Start-Process -FilePath $dmz -ArgumentList "-token `"$env:SUPERDMZ_TOKEN`"" -RedirectStandardOutput $outLog -RedirectStandardError $errLog -PassThru -WindowStyle Hidden

          Write-Host "[✓] تم إطلاق عملية SuperDMZ (PID: $($process.Id))" -ForegroundColor Green
          Write-Host "============================================" -ForegroundColor Yellow
          Write-Host "       بيانات الاتصال بـ WINDOWS RDP" -ForegroundColor Yellow
          Write-Host "============================================" -ForegroundColor Yellow
          Write-Host "اسم المستخدم (Username): $finalUser" -ForegroundColor Green
          Write-Host "كلمة السر     (Password): $finalPass" -ForegroundColor Green
          Write-Host "============================================" -ForegroundColor Yellow
          Write-Host "مراقبة السجلات المباشرة للأداة:" -ForegroundColor Cyan

          $lastOutLine = 0
          $lastErrLine = 0

          while ($true) {
            if (Test-Path $outLog) {
              $outLines = Get-Content $outLog -ErrorAction SilentlyContinue
              if ($outLines.Count -gt $lastOutLine) {
                for ($i = $lastOutLine; $i -lt $outLines.Count; $i++) {
                  Write-Host "[SuperDMZ] $($outLines[$i])" -ForegroundColor Gray
                }
                $lastOutLine = $outLines.Count
              }
            }

            if (Test-Path $errLog) {
              $errLines = Get-Content $errLog -ErrorAction SilentlyContinue
              if ($errLines.Count -gt $lastErrLine) {
                for ($j = $lastErrLine; $j -lt $errLines.Count; $j++) {
                  Write-Host "[SuperDMZ ERR] $($errLines[$j])" -ForegroundColor Red
                }
                $lastErrLine = $errLines.Count
              }
            }

            Start-Sleep -Seconds 3
          }

      - name: Cleanup
        if: always()
        shell: pwsh
        run: |
          Get-Process -Name "superdmz" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
