name: Windows RDP via SuperDMZ

on:
  push:
  workflow_dispatch:

jobs:
  rdp-setup:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      - name: Download and Install SuperDMZ Client
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $downloadUrl = "https://superdmz.com/login/dl.php?app=windows-installer"
          $installerPath = "$env:RUNNER_TEMP\superdmz_setup.exe"
          $targetExec = "$env:GITHUB_WORKSPACE\superdmz.exe"

          Write-Host "جاري تحميل أداة SuperDMZ مع اتباع التوجيهات (Redirects)..."
          
          # استخدام curl.exe لضمان جلب الملف الأخير من الرابط المباشر
          curl.exe -sL $downloadUrl -o $installerPath

          if (-not (Test-Path $installerPath) -or (Get-Item $installerPath).Length -lt 500000) {
            throw "فشل التحميل أو أن الملف غير مكتمل. يرجى التأكد من أن الرابط لا يتطلب تسجيل دخول."
          }

          Write-Host "جاري تنفيذ التثبيت الصامت لاستخراج الملف التنفيذي..."

          # تثبيت صامت للبرنامج في بيئة Runner
          Start-Process -FilePath $installerPath -ArgumentList "/S", "/VERYSILENT", "/quiet" -Wait -ErrorAction SilentlyContinue

          # البحث عن المسار الذي استقر فيه الملف التنفيذي
          $possiblePaths = @(
            "$env:ProgramFiles\SuperDMZ\superdmz.exe",
            "${env:ProgramFiles(x86)}\SuperDMZ\superdmz.exe",
            "$env:LOCALAPPDATA\Programs\SuperDMZ\superdmz.exe",
            "$env:APPDATA\SuperDMZ\superdmz.exe"
          )

          $foundPath = $possiblePaths | Where-Object { Test-Path $_ } | Select-Object -First 1

          if ($foundPath) {
            Copy-Item -Path $foundPath -Destination $targetExec -Force
            Write-Host "تم تثبيت واستخراج superdmz.exe بنجاح."
          } else {
            # في حال كان الرابط يعيد الأداة مباشرة بدون برنامج تثبيت
            Move-Item -Path $installerPath -Destination $targetExec -Force
            Write-Host "تم تجهيز الأداة المباشرة بنجاح."
          }

      - name: Enable RDP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Set-Service `
            -Name "TermService" `
            -StartupType Automatic

          Start-Service `
            -Name "TermService" `
            -ErrorAction SilentlyContinue

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop"

          Write-Host "RDP enabled successfully."

      - name: Create RDP User
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $username = "H1Z"
          $password = "DRISdris@123"

          $existing = Get-LocalUser `
            -Name $username `
            -ErrorAction SilentlyContinue

          if ($existing) {
            Remove-LocalUser `
              -Name $username
          }

          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          New-LocalUser `
            -Name $username `
            -Password $securePassword `
            -FullName "H1Z RDP User" `
            -Description "Temporary RDP user" `
            -PasswordNeverExpires

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $username

          Write-Host "RDP user created."

      - name: Allow RDP Firewall
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Get-NetFirewallRule `
              -DisplayName "Allow RDP via SuperDMZ" `
              -ErrorAction SilentlyContinue)) {

            New-NetFirewallRule `
              -DisplayName "Allow RDP via SuperDMZ" `
              -Direction Inbound `
              -Action Allow `
              -Protocol TCP `
              -LocalPort 3389
          }

          Write-Host "Firewall configured."

      - name: Start SuperDMZ RDP Tunnel
        shell: pwsh
        env:
          SUPERDMZ_TOKEN: ${{ secrets.SUPERDMZ_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:SUPERDMZ_TOKEN)) {
            throw "SUPERDMZ_TOKEN GitHub Secret is missing."
          }

          $dmz = "$env:GITHUB_WORKSPACE\superdmz.exe"

          if (-not (Test-Path $dmz)) {
            throw "الملف التنفيذي superdmz.exe غير موجود لربط النفق."
          }

          Write-Host "Starting SuperDMZ RDP tunnel..."

          Start-Process `
            -FilePath $dmz `
            -ArgumentList "-k `"$env:SUPERDMZ_TOKEN`" rdp" `
            -RedirectStandardOutput "$env:RUNNER_TEMP\superdmz.log" `
            -RedirectStandardError "$env:RUNNER_TEMP\superdmz-error.log" `
            -WindowStyle Hidden

          Start-Sleep -Seconds 12

          if (Test-Path "$env:RUNNER_TEMP\superdmz.log") {
            Get-Content "$env:RUNNER_TEMP\superdmz.log" -ErrorAction SilentlyContinue
          }
          if (Test-Path "$env:RUNNER_TEMP\superdmz-error.log") {
            Get-Content "$env:RUNNER_TEMP\superdmz-error.log" -ErrorAction SilentlyContinue
          }

          Write-Host ""
          Write-Host "============================================"
          Write-Host "       WINDOWS RDP VIA SUPERDMZ"
          Write-Host "============================================"
          Write-Host "Username: H1Z"
          Write-Host "Password: DRISdris@123"
          Write-Host "============================================"
          Write-Host ""

          while ($true) {
            Start-Sleep -Seconds 300
          }

      - name: Cleanup
        if: always()
        shell: pwsh
        run: |
          Get-Process `
            -Name "superdmz" `
            -ErrorAction SilentlyContinue |
            Stop-Process `
              -Force `
              -ErrorAction SilentlyContinue
