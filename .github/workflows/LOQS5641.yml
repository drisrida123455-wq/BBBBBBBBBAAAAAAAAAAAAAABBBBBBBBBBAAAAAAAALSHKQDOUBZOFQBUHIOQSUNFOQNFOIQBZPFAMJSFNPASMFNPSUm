name: Windows RDP via Ngrok

on:
  push:

jobs:
  rdp-setup:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      - name: Download Ngrok
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip"
          $zip = "$env:RUNNER_TEMP\ngrok.zip"
          $dir = "$env:RUNNER_TEMP\ngrok"

          Invoke-WebRequest -Uri $url -OutFile $zip

          if (Test-Path $dir) {
            Remove-Item $dir -Recurse -Force
          }

          New-Item -ItemType Directory -Path $dir -Force | Out-Null

          Expand-Archive `
            -Path $zip `
            -DestinationPath $dir `
            -Force

          if (-not (Test-Path "$dir\ngrok.exe")) {
            throw "ngrok.exe was not found."
          }

          Copy-Item `
            "$dir\ngrok.exe" `
            "$env:GITHUB_WORKSPACE\ngrok.exe" `
            -Force

          Write-Host "Ngrok downloaded successfully."

      - name: Authenticate Ngrok
        shell: pwsh
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:NGROK_AUTH_TOKEN)) {
            throw "NGROK_AUTH_TOKEN secret is missing."
          }

          & "$env:GITHUB_WORKSPACE\ngrok.exe" config add-authtoken "$env:NGROK_AUTH_TOKEN"

          if ($LASTEXITCODE -ne 0) {
            throw "Ngrok authentication failed."
          }

          Write-Host "Ngrok authentication successful."

      - name: Enable RDP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Set-Service `
            -Name "TermService" `
            -StartupType Automatic

          Start-Service `
            -Name "TermService" `
            -ErrorAction SilentlyContinue

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop"

          Write-Host "RDP enabled successfully."

      - name: Create RDP User
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $username = "H1Z"
          $password = "DRISdris@123"

          # Check whether H1Z already exists
          $existingUser = Get-LocalUser `
            -Name $username `
            -ErrorAction SilentlyContinue

          if ($existingUser) {
            Remove-LocalUser `
              -Name $username
          }

          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          New-LocalUser `
            -Name $username `
            -Password $securePassword `
            -FullName "H1Z RDP User" `
            -Description "RDP user for this temporary GitHub runner" `
            -PasswordNeverExpires

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $username

          Write-Host "============================================"
          Write-Host "RDP USER CREATED"
          Write-Host "Username: H1Z"
          Write-Host "============================================"

      - name: Allow RDP Firewall Rule
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $rule = Get-NetFirewallRule `
            -DisplayName "Allow RDP via Ngrok" `
            -ErrorAction SilentlyContinue

          if (-not $rule) {
            New-NetFirewallRule `
              -DisplayName "Allow RDP via Ngrok" `
              -Direction Inbound `
              -Action Allow `
              -Protocol TCP `
              -LocalPort 3389 | Out-Null
          }

          Write-Host "Firewall rule configured."

      - name: Start Ngrok RDP Tunnel
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $ngrok = "$env:GITHUB_WORKSPACE\ngrok.exe"
          $log = "$env:RUNNER_TEMP\ngrok.log"

          if (Test-Path $log) {
            Remove-Item $log -Force
          }

          # IMPORTANT:
          # Only redirect stdout.
          # Redirecting stdout and stderr to the same file causes
          # the PowerShell error seen previously.

          Start-Process `
            -FilePath $ngrok `
            -ArgumentList "tcp 3389 --log=stdout" `
            -RedirectStandardOutput $log `
            -WindowStyle Hidden

          Write-Host "Waiting for Ngrok tunnel..."

          $publicUrl = $null
          $deadline = (Get-Date).AddSeconds(90)

          while ((Get-Date) -lt $deadline -and -not $publicUrl) {

            Start-Sleep -Seconds 3

            try {
              $response = Invoke-RestMethod `
                -Uri "http://127.0.0.1:4040/api/tunnels" `
                -Method Get `
                -ErrorAction Stop

              if ($response.tunnels) {

                foreach ($tunnel in $response.tunnels) {

                  if ($tunnel.public_url -like "tcp://*") {
                    $publicUrl = $tunnel.public_url
                    break
                  }

                }
              }
            }
            catch {
              # Ngrok API may not be ready yet.
            }

            # Fallback: check the log
            if (-not $publicUrl -and (Test-Path $log)) {

              $content = Get-Content `
                $log `
                -Raw `
                -ErrorAction SilentlyContinue

              if ($content -match 'tcp://([A-Za-z0-9\.\-]+:\d+)') {
                $publicUrl = "tcp://$($Matches[1])"
              }
            }
          }

          if (-not $publicUrl) {

            Write-Host ""
            Write-Host "========== NGROK LOG =========="

            if (Test-Path $log) {
              Get-Content $log
            }

            Write-Host "==============================="

            throw "Ngrok tunnel could not be established."
          }

          $address = $publicUrl -replace "^tcp://", ""

          Write-Host ""
          Write-Host "============================================"
          Write-Host "       WINDOWS RDP CONNECTION"
          Write-Host "============================================"
          Write-Host "Address : $address"
          Write-Host "Username: H1Z"
          Write-Host "Password: DRISdris@123"
          Write-Host "============================================"
          Write-Host ""
          Write-Host "Open Windows Remote Desktop (mstsc.exe)"
          Write-Host "and enter the Address shown above."
          Write-Host ""

          # Keep the GitHub runner alive
          while ($true) {
            Start-Sleep -Seconds 300
          }

      - name: Cleanup Ngrok
        if: always()
        shell: pwsh
        run: |
          Get-Process `
            -Name "ngrok" `
            -ErrorAction SilentlyContinue |
            Stop-Process `
              -Force `
              -ErrorAction SilentlyContinue

          Write-Host "Ngrok process stopped."
