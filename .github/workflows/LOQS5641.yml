name: Windows RDP via SuperDMZ

on:
  push:
  workflow_dispatch:

jobs:
  rdp-setup:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      - name: Download and Extract SuperDMZ Client
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $rawUrl = "https://raw.githubusercontent.com/drisrida123455-wq/Xddg77-GbklKMooooooooo156sqd89fh47gfhj-g/main/SuperDMZ-Setup-v1.9.1.exe"
          $installer = "$env:RUNNER_TEMP\installer.exe"
          $extractDir = "$env:RUNNER_TEMP\extracted"
          $targetExec = "$env:GITHUB_WORKSPACE\superdmz.exe"

          Write-Host "جاري تحميل ملف التثبيت..."
          curl.exe -sL $rawUrl -o $installer

          if (-not (Test-Path $installer)) {
            throw "فشل تحميل ملف التثبيت من المستودع."
          }

          Write-Host "جاري استخراج الملف التنفيذي باستخدام 7-Zip..."
          7z x $installer "-o$extractDir" -y | Out-Null

          # البحث عن الملف التنفيذي داخل الأرشيف المستخرج
          $foundExe = Get-ChildItem -Path $extractDir -Recurse -Filter "*.exe" | 
            Where-Object { $_.Name -notmatch "setup|uninstall" } | 
            Select-Object -First 1

          if (-not $foundExe) {
            Write-Host "جاري تجربة التثبيت الصامت كخيار بديل..."
            Start-Process -FilePath $installer -ArgumentList "/S", "/VERYSILENT", "/quiet" -Wait -ErrorAction SilentlyContinue
            $foundExe = Get-ChildItem -Path "$env:ProgramFiles", "$env:LOCALAPPDATA" -Recurse -Filter "superdmz.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          }

          if ($foundExe) {
            Copy-Item -Path $foundExe.FullName -Destination $targetExec -Force
            Write-Host "تم استخراج وتجهيز superdmz.exe بنجاح."
          } else {
            throw "تعذر استخراج superdmz.exe من ملف التثبيت."
          }

      - name: Enable RDP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Set-Service `
            -Name "TermService" `
            -StartupType Automatic

          Start-Service `
            -Name "TermService" `
            -ErrorAction SilentlyContinue

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop"

          Write-Host "RDP enabled successfully."

      - name: Create RDP User
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $username = "H1Z"
          $password = "DRISdris@123"

          $existing = Get-LocalUser `
            -Name $username `
            -ErrorAction SilentlyContinue

          if ($existing) {
            Remove-LocalUser `
              -Name $username
          }

          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          New-LocalUser `
            -Name $username `
            -Password $securePassword `
            -FullName "H1Z RDP User" `
            -Description "Temporary RDP user" `
            -PasswordNeverExpires

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $username

          Write-Host "RDP user created."

      - name: Allow RDP Firewall
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Get-NetFirewallRule `
              -DisplayName "Allow RDP via SuperDMZ" `
              -ErrorAction SilentlyContinue)) {

            New-NetFirewallRule `
              -DisplayName "Allow RDP via SuperDMZ" `
              -Direction Inbound `
              -Action Allow `
              -Protocol TCP `
              -LocalPort 3389
          }

          Write-Host "Firewall configured."

      - name: Start SuperDMZ RDP Tunnel
        shell: pwsh
        env:
          SUPERDMZ_TOKEN: ${{ secrets.SUPERDMZ_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:SUPERDMZ_TOKEN)) {
            throw "SUPERDMZ_TOKEN GitHub Secret is missing."
          }

          $dmz = "$env:GITHUB_WORKSPACE\superdmz.exe"

          Write-Host "Starting SuperDMZ RDP tunnel..."

          Start-Process `
            -FilePath $dmz `
            -ArgumentList "-k `"$env:SUPERDMZ_TOKEN`" rdp" `
            -RedirectStandardOutput "$env:RUNNER_TEMP\superdmz.log" `
            -RedirectStandardError "$env:RUNNER_TEMP\superdmz-error.log" `
            -WindowStyle Hidden

          Start-Sleep -Seconds 12

          if (Test-Path "$env:RUNNER_TEMP\superdmz.log") {
            Get-Content "$env:RUNNER_TEMP\superdmz.log" -ErrorAction SilentlyContinue
          }
          if (Test-Path "$env:RUNNER_TEMP\superdmz-error.log") {
            Get-Content "$env:RUNNER_TEMP\superdmz-error.log" -ErrorAction SilentlyContinue
          }

          Write-Host ""
          Write-Host "============================================"
          Write-Host "       WINDOWS RDP VIA SUPERDMZ"
          Write-Host "============================================"
          Write-Host "Username: H1Z"
          Write-Host "Password: DRISdris@123"
          Write-Host "============================================"
          Write-Host ""

          while ($true) {
            Start-Sleep -Seconds 300
          }

      - name: Cleanup
        if: always()
        shell: pwsh
        run: |
          Get-Process `
            -Name "superdmz" `
            -ErrorAction SilentlyContinue |
            Stop-Process `
              -Force `
              -ErrorAction SilentlyContinue
